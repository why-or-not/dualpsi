[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dualpsi"
version = "0.1.0"
description = "두 정당 명부를 서로 공개하지 않고 이중당적자를 산출하는 PSI 도구 (ECDH-PSI + DLEQ 영지식 증명 + 명부 커밋·감사)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pynacl>=1.5.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dualpsi = "dualpsi.cli:main"

[tool.setuptools]
packages = ["dualpsi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
